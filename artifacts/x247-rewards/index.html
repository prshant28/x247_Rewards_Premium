<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>X247 Rewards — Rewards that you need Indeed</title>
    <meta name="description" content="Rewards that you need Indeed. Elevate your rewards with verified referrals and exclusive access. Join the premier Google event program for daily swag, gift cards, and hackathon invites." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body { background: #000; margin: 0; padding: 0; }
      html[data-light], html[data-light] body { background: #f5f5f5; }
      #root { min-height: 100vh; }
      .font-loading-fallback { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </head>
  <body>
    <script>
      (function(){try{var t=localStorage.getItem('x247_theme');var L=['pristine-light','ivory-soft','silver-mist'];if(t&&L.indexOf(t)!==-1){document.documentElement.setAttribute('data-light','');document.documentElement.setAttribute('data-theme',t);}else{document.documentElement.classList.add('dark');if(t)document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
